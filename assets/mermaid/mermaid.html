<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
  #container { width: 100%; }
  #container svg { display: block; margin: 0 auto; }
</style>
</head>
<body>
<div id="container"></div>
<script src="mermaid.min.js"></script>
<script>
(function () {
  var lastKey = null;
  var observer = null;

  function post(message) {
    // Windows(WebView2) 与 Android(webview_flutter) 的消息通道不同
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage(message);
      return;
    }
    if (window.FlutterMermaidChannel) {
      window.FlutterMermaidChannel.postMessage(message);
    }
  }

  function reportHeight() {
    var el = document.getElementById('container');
    if (!el) return;
    var height = Math.ceil(el.getBoundingClientRect().height);
    if (height > 0) post('height:' + height);
  }

  function observeContainer() {
    var el = document.getElementById('container');
    if (observer || !el || typeof ResizeObserver === 'undefined') return;
    observer = new ResizeObserver(function () { reportHeight(); });
    observer.observe(el);
  }

  // 把当前 SVG 高清栅格化为 PNG:点击图表放大查看时由 Flutter 调用。
  // 优先用 viewBox 固有尺寸(mermaid 布局的自然宽度),限制倍数与总像素,
  // 避免 PNG 传输与图片解码内存失控。
  window.snapshotMermaid = function () {
    var el = document.getElementById('container');
    var svg = el && el.querySelector('svg');
    if (!svg) {
      post('snapshot:error:图表尚未渲染完成');
      return;
    }
    try {
      var rect = el.getBoundingClientRect();
      var viewBox = svg.viewBox && svg.viewBox.baseVal;
      var naturalW = (viewBox && viewBox.width) || rect.width;
      var naturalH = (viewBox && viewBox.height) || rect.height;
      if (!rect.width || !rect.height) {
        post('snapshot:error:图表尺寸为 0');
        return;
      }
      var scale = Math.max(1, Math.min(3, naturalW / rect.width));
      var maxPixels = 16000000;
      if (rect.width * scale * rect.height * scale > maxPixels) {
        scale = Math.sqrt(maxPixels / (rect.width * rect.height));
      }
      var outW = Math.round(rect.width * scale);
      var outH = Math.round(rect.height * scale);
      var clone = svg.cloneNode(true);
      clone.setAttribute('width', outW);
      clone.setAttribute('height', outH);
      clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      // useMaxWidth 模式下 svg 带内联 max-width,不覆盖会压回原尺寸留白
      clone.style.maxWidth = 'none';
      clone.style.width = outW + 'px';
      clone.style.height = outH + 'px';
      var xml = new XMLSerializer().serializeToString(clone);
      var img = new Image();
      img.onload = function () {
        try {
          var canvas = document.createElement('canvas');
          canvas.width = outW;
          canvas.height = outH;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, outW, outH);
          post('snapshot:' + canvas.toDataURL('image/png'));
        } catch (e) {
          post('snapshot:error:' + e);
        }
      };
      img.onerror = function () {
        post('snapshot:error:SVG 转图片失败');
      };
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
    } catch (e) {
      post('snapshot:error:' + e);
    }
  };

  window.renderMermaid = function (encodedCode, theme, background) {
    var code;
    try {
      code = decodeURIComponent(encodedCode);
    } catch (e) {
      post('error:' + e);
      return;
    }
    var key = theme + '|' + code;
    if (key === lastKey) return;
    lastKey = key;
    document.body.style.background = background;
    var el = document.getElementById('container');
    el.innerHTML = '';
    try {
      mermaid.initialize({
        startOnLoad: false,
        theme: theme,
        securityLevel: 'strict',
        flowchart: { useMaxWidth: true },
        sequence: { useMaxWidth: true },
        gantt: { useMaxWidth: true }
      });
    } catch (e) {}
    mermaid.render('mmd-' + Date.now(), code).then(function (result) {
      if (key !== lastKey) return;
      el.innerHTML = result.svg;
      observeContainer();
      requestAnimationFrame(reportHeight);
      // 字体加载完成后高度可能变化,延迟再上报一次
      setTimeout(reportHeight, 150);
      setTimeout(reportHeight, 500);
    }).catch(function (err) {
      lastKey = null;
      var message = err && err.message ? err.message : String(err);
      post('error:' + message);
    });
  };

  post('pageReady');
})();
</script>
</body>
</html>
